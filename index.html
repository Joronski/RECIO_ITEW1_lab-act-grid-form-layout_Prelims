<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RECIO | Grid Form Layout</title>

        <!-- CSS -->
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="grid-1">
                <p>Name</p>
            </div>
            <div class="grid-2">
                <input type="text">
            </div>
            <div class="grid-3">
                <p>Email</p>
            </div>
            <div class="grid-4">
                <input type="email">
            </div>
            <div class="grid-5">
                <p>Comments</p>
            </div>
            <div class="grid-6">
                <textarea name="Comments" id="comments"></textarea>
            </div>
            <div class="grid-7">
                <button>Submit</button>
            </div>
        </div>
    </body>
</html>
